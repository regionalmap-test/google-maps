<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Small Area Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    #map { 
      height: 100vh; 
      width: 100vw; 
    }

    #passwordDiv {
      position: absolute; 
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255,255,255,0.95); 
      display: flex;
      align-items: center; 
      justify-content: center; 
      flex-direction: column;
      z-index: 1000;
      padding: 20px;
    }

    #passwordInput {
      width: 90%;
      max-width: 400px;
      padding: 1em;
      font-size: 1.2em;
      border-radius: 8px;
      border: 1px solid #aaa;
      box-sizing: border-box;
    }

    #submitBtn {
      width: 90%;
      max-width: 400px;
      padding: 1em;
      font-size: 1.2em;
      margin-top: 0.8em;
      border-radius: 8px;
      border: none;
      background: #4285F4;
      color: white;
      box-sizing: border-box;
    }

    #passwordDiv h2 {
      font-size: 1.5em;
      margin-bottom: 1em;
    }

    #msg { 
      margin-top: 0.6em; 
      color: red; 
      font-size: 1.1em; 
    }

    @media (max-width: 480px) {
      #passwordDiv h2 { font-size: 1.3em; }
      #passwordInput, #submitBtn { font-size: 1.1em; padding: 0.9em; }
    }
  </style>

  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBlkqCeYEheeLNZ-jEODKfVfznTbo-8jZE"></script>
</head>
<body>

  <div id="passwordDiv">
    <h2>パスワードを入力してください</h2>
    <input type="password" id="passwordInput" placeholder="パスワード">
    <button id="submitBtn">表示</button>
    <p id="msg"></p>
  </div>

  <div id="map"></div>

  <script>
    const correctPassword = "1914";
    const submitBtn = document.getElementById("submitBtn");
    const passwordInput = document.getElementById("passwordInput");
    const passwordDiv = document.getElementById("passwordDiv");
    const msg = document.getElementById("msg");

    submitBtn.onclick = function() {
      if (passwordInput.value === correctPassword) {
        passwordDiv.style.display = "none";
        initMap();
      } else {
        msg.textContent = "パスワードが違います。";
      }
    };

    function initMap() {
      const map = new google.maps.Map(document.getElementById("map"), {
        center: {lat: 35.68, lng: 139.76},
        zoom: 15
      });

      // ✅ マーカー用データ（単品 HTML 内にすべて記述）
      const markerData = [
        {lat: 35.6895, lng: 139.6917, name: "訪問しないお宅"},
        {lat: 35.6900, lng: 139.6920, name: "ビジネス"},
        {lat: 35.6890, lng: 139.6930, name: "その他"}
      ];

      // 自動でピンを作成（色分け）
      markerData.forEach(m => {
        let iconUrl = null;
        if (m.name === "訪問しないお宅") {
          iconUrl = "http://maps.google.com/mapfiles/kml/pushpin/red-pushpin.png";
        } else if (m.name === "ビジネス") {
          iconUrl = "http://maps.google.com/mapfiles/kml/pushpin/blue-pushpin.png";
        }

        new google.maps.Marker({
          position: {lat: m.lat, lng: m.lng},
          map: map,
          icon: iconUrl,  // nullならデフォルトピン
          title: m.name
        });
      });
    }
  </script>

</body>
</html>
