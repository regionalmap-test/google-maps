
<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <style>
      #map {
        height: 100vh;
        width: 100%;
        margin: 0;
        padding: 0;
      }
      body {
        margin: 0;
      }
    </style>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBlkqCeYEheeLNZ-jEODKfVfznTbo-8jZE"></script>
  </head>
  <body>
    <div id="map"></div>
    <script>
		function initMap() {
			const map = new google.maps.Map(document.getElementById("map"), {
			zoom: 11,
			mapTypeControl: false,
			fullscreenControl: false,
 			streetViewControl: false
		});

        // ▼▼ ここを書き換えてください ▼▼
        // GitHub Pages 等に KML をアップロードして、その生URLを下に貼る
        const kmlUrl = "https://regionalmap-test.github.io/google-maps/KML_GitHub/fullmap_KML.kml";

        new google.maps.KmlLayer({
    		url: kmlUrl,
    		map: map,
    		suppressInfoWindows: false,
    		preserveViewport: false   // ← これが KML に合わせてズームしてくれる
 		});
      }

      window.onload = initMap;
    </script>
  </body>
</html>
