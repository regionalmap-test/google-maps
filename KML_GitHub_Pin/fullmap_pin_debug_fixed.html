<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="initial-scale=1, width=device-width">
<style>
  #map { height: 100vh; width: 100%; margin:0; padding:0; }
  body { margin: 0; }
</style>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB7tjqWBxnVBtgQZvEeWwneI7XaVOJ1scI"></script>
</head>
<body>
<div id="map"></div>
<script>
// WKT 形式から座標を取り出す関数
function parseWKT(wkt){
  const coords = wkt.match(/POINT \(([^ ]+) ([^ ]+)\)/);
  return { lng: parseFloat(coords[1]), lat: parseFloat(coords[2]) };
}

// CSV を JS 配列に変換
function parseCSV(data){
  const lines = data.trim().split("\n").slice(1); // ヘッダ除去
  return lines.map(line => {
    const parts = line.split(",");
    const coords = parseWKT(parts[0].replace(/"/g,""));
    return { name: parts[1], lat: coords.lat, lng: coords.lng, color: parts[3] || "red" };
  });
}

function initMap(){
  // 仮の中心座標
  const map = new google.maps.Map(document.getElementById("map"), {
    center: { lat: 35.681236, lng: 139.767125 },
    zoom: 11,
    mapTypeControl: false,
    fullscreenControl: false,
    streetViewControl: false
  });

  // マーカーの範囲を自動調整する
  const bounds = new google.maps.LatLngBounds();

  // CSV 読み込み
  fetch('fullmap_pin.csv')
    .then(response => response.text())
    .then(data => {
      console.log("=== CSV データ ===");
      console.log(data);

      const markers = parseCSV(data);
      console.log("=== パース後のマーカー配列 ===");
      console.log(markers);

      markers.forEach(m => {
        const marker = new google.maps.Marker({
          position: { lat: m.lat, lng: m.lng },
          map: map,
          title: m.name,
          icon: {
            path: google.maps.SymbolPath.CIRCLE,
            scale: 8,
            fillColor: m.color,
            fillOpacity: 1,
            strokeWeight: 1
          }
        });

        const label = new google.maps.InfoWindow({ content: m.name });
        marker.addListener("click", () => label.open(map, marker));
        label.open(map, marker); // ラベル常時表示

        bounds.extend(marker.getPosition());
      });

      // 全マーカーが見えるように地図を調整
      map.fitBounds(bounds);
    })
    .catch(e => {
      console.error("CSV 読み込みエラー:", e);
    });
}

window.onload = initMap;
</script>
</body>
</html>
